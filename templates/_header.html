{% include '_loading_screen.html' %}
<header class="site-header" id="site-header">
  <nav class="navbar container" aria-label="Main Navigation">
    <a href="{{ url_for('home') }}" class="brand">
      <div class="brand-mark">
        <img src="{{ url_for('static', filename='images/Logo_Fort_Kobbe_Shield_Transparent.png') }}" alt="Fort Kobbe shield logo" />
      </div>
      <span>FK PHYSICAL LLC</span>
    </a>

    <button class="menu-toggle" aria-label="Toggle navigation" aria-expanded="false">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <div class="nav-links">
      <a href="{{ url_for('home') }}">Home</a>
      <a href="{{ url_for('about') }}">About</a>
      <a href="{{ url_for('metals') }}">Gold &amp; Silver</a>
      <a href="{{ url_for('how_it_works') }}">How It Works</a>

    </div>
  </nav>
<!-- Live Precious Metals Spot Price Ticker Bar -->
  <div class="metals-ticker-bar">
    <div class="container ticker-container">
      <div class="ticker-label">
        <span class="live-indicator"></span> LIVE SPOT PRICES
      </div>
      <div class="ticker-items">
        <div class="ticker-item">
          <span class="metal-name">GOLD (XAU/USD)</span>
          <span class="metal-price" id="gold-price">$2,650.40</span>
          <span class="metal-change positive" id="gold-change">+0.45%</span>
        </div>
        <div class="ticker-divider"></div>
        <div class="ticker-item">
          <span class="metal-name">SILVER (XAG/USD)</span>
          <span class="metal-price" id="silver-price">$31.85</span>
          <span class="metal-change positive" id="silver-change">+0.82%</span>
        </div>
      </div>
      <div class="ticker-time" id="ticker-timestamp">Updated Live</div>
    </div>
  </div>
  <style>
    .site-header {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      z-index: 1000 !important;
      background: rgba(24, 23, 19, 0.65) !important;
      backdrop-filter: blur(8px) !important;
      box-shadow: 0 2px 20px rgba(0, 0, 0, 0.2) !important;
    }

    .site-header .brand,
    .site-header .nav-links a {
      color: #ffffff !important;
    }

    .site-header .nav-links a:hover {
      color: #c8ad70 !important;
    }
  </style>
</header>
